name: News

on:
  schedule:
    - cron: "7 * * * *"   # jede Stunde zur Minute 7 (UTC)
  workflow_dispatch:       # Knopf zum manuellen Starten

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: News holen und bewerten
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python build.py

      - name: Ergebnis speichern
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data.json state.json
          if ! git diff --staged --quiet; then
            git commit -m "News-Update"
            git pull --rebase
            git push
          fi
