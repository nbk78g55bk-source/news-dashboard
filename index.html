<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="News">
<meta name="theme-color" content="#0f1115">
<title>News</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14171c;--mu:#6b7280;--bd:#e5e7eb;--ac:#2563eb;--up:#16a34a;--dn:#dc2626;--hot:#f59e0b}
@media(prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#171a21;--tx:#e8eaed;--mu:#9aa3b2;--bd:#262b36;--ac:#6ea0ff;--up:#4ade80;--dn:#f87171;--hot:#fbbf24}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--bd)}
.top{display:flex;justify-content:space-between;align-items:baseline;padding:12px 16px 4px}
h1{font-size:20px;margin:0}
.upd{color:var(--mu);font-size:12px}
.markt{display:flex;gap:8px;overflow-x:auto;padding:6px 16px 10px;scrollbar-width:none}
.markt::-webkit-scrollbar{display:none}
.m{flex:none;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:6px 10px;min-width:92px}
.m .n{font-size:11px;color:var(--mu)}
.m .v{font-size:15px;font-weight:600}
.m .d{font-size:11px}
.up{color:var(--up)}.dn{color:var(--dn)}
nav{display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer}
nav button.on{background:var(--ac);border-color:var(--ac);color:#fff}
main{max-width:760px;margin:0 auto;padding:12px 16px 40px}
.card{display:block;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:10px;color:inherit;text-decoration:none}
.card .t{font-weight:600;margin-bottom:4px}
.card .s{color:var(--mu);font-size:15px}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--mu);align-items:center}
.pill{border:1px solid var(--bd);border-radius:999px;padding:0 8px}
.hot{border-color:var(--hot);color:var(--hot)}
.leer{color:var(--mu);text-align:center;padding:40px 0}
</style>
</head>
<body>
<header>
  <div class="top"><h1>News</h1><span class="upd" id="upd">lädt…</span></div>
  <div class="markt" id="markt"></div>
  <nav id="nav"></nav>
</header>
<main id="main"></main>
<script>
const TABS=[["top","Wichtig"],["finanzen","Finanzen"],["deutschland","Deutschland"],["nrw","NRW"],["usa","USA"],["welt","Welt"]];
let DATA={items:[],markt:[]},tab="top";

function ago(iso){
  const m=Math.round((Date.now()-new Date(iso).getTime())/60000);
  if(m<1)return "gerade eben";
  if(m<60)return "vor "+m+" Min";
  const h=Math.round(m/60);
  if(h<24)return "vor "+h+" Std";
  return "vor "+Math.round(h/24)+" Tg";
}
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function safe(u){return /^https?:\/\//i.test(u)?u:"#"}

function renderMarkt(){
  const box=document.getElementById("markt");box.textContent="";
  (DATA.markt||[]).forEach(m=>{
    const c=el("div","m");
    c.appendChild(el("div","n",m.name));
    c.appendChild(el("div","v",m.wert));
    if(typeof m.delta==="number"){
      const up=m.delta>=0;
      c.appendChild(el("div","d "+(up?"up":"dn"),(up?"▲ ":"▼ ")+Math.abs(m.delta).toFixed(2).replace(".",",")+" %"));
    }
    box.appendChild(c);
  });
}
function renderNav(){
  const nav=document.getElementById("nav");nav.textContent="";
  TABS.forEach(([k,l])=>{
    const b=el("button",k===tab?"on":"",l);
    b.onclick=()=>{tab=k;renderNav();renderList()};
    nav.appendChild(b);
  });
}
function renderList(){
  const main=document.getElementById("main");main.textContent="";
  let items=(DATA.items||[]).slice();
  if(tab==="top"){
    items=items.filter(i=>i.s>=8).sort((a,b)=>b.s-a.s||(a.zeit<b.zeit?1:-1));
  }else{
    items=items.filter(i=>i.k===tab);
  }
  if(!items.length){main.appendChild(el("div","leer","Gerade nichts in dieser Rubrik."));return}
  items.forEach(i=>{
    const a=el("a","card");a.href=safe(i.link);a.target="_blank";a.rel="noopener noreferrer";
    a.appendChild(el("div","t",i.titel));
    a.appendChild(el("div","s",i.t));
    const meta=el("div","meta");
    meta.appendChild(el("span","",i.quelle));
    meta.appendChild(el("span","",ago(i.zeit)));
    if(i.s>=8)meta.appendChild(el("span","pill hot","wichtig"));
    if(i.tag)meta.appendChild(el("span","pill",i.tag));
    a.appendChild(meta);
    main.appendChild(a);
  });
}
async function load(){
  try{
    const r=await fetch("data.json?"+Date.now());
    DATA=await r.json();
    document.getElementById("upd").textContent="Stand "+new Date(DATA.aktualisiert).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})+" Uhr";
  }catch(e){
    document.getElementById("upd").textContent="Noch keine Daten";
  }
  renderMarkt();renderNav();renderList();
}
load();
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
</script>
</body>
</html>
