<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="News">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="color-scheme" content="light dark">
<title>News</title>
<style>
:root{
  --bg:#f4f5f7;--surface:#ffffff;--surface2:#f0f2f5;--tx:#12151b;--mu:#667085;--bd:#e4e7ec;
  --ac:#2457d6;--up:#12a150;--dn:#d92d20;--hot:#e8590c;--shadow:0 1px 2px rgba(16,24,40,.05),0 2px 8px rgba(16,24,40,.04);
  --c-finanzen:#0f9d77;--c-deutschland:#2f6fed;--c-nrw:#e8590c;--c-usa:#c92a5a;--c-welt:#7c4dff;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0b0d12;--surface:#14171e;--surface2:#1b1f28;--tx:#eceef2;--mu:#98a2b3;--bd:#252a35;
  --ac:#7aa2ff;--up:#4ade80;--dn:#ff7b72;--hot:#ffa94d;--shadow:0 1px 2px rgba(0,0,0,.4);
  --c-finanzen:#2dd4a7;--c-deutschland:#7aa2ff;--c-nrw:#ffa94d;--c-usa:#ff6b9a;--c-welt:#b197fc;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);
  font:16px/1.5 ui-sans-serif,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
.hero{padding:calc(env(safe-area-inset-top) + 22px) 0 6px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.hero h1{margin:0;font-size:28px;line-height:1.1;letter-spacing:-.02em}
.hero .date{color:var(--mu);font-size:14px;margin-top:4px}
.stand{color:var(--mu);font-size:12px;text-align:right;white-space:nowrap}
.stand b{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--up);margin-right:6px;vertical-align:1px}
.stand.old b{background:var(--hot)}
.markt{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none;scroll-snap-type:x proximity}
.markt::-webkit-scrollbar{display:none}
.m{flex:none;scroll-snap-align:start;background:var(--surface);border:1px solid var(--bd);border-radius:14px;padding:9px 12px;min-width:104px;box-shadow:var(--shadow)}
.m .n{font-size:11px;color:var(--mu);white-space:nowrap}
.m .v{font-size:16px;font-weight:650;letter-spacing:-.01em;white-space:nowrap;font-variant-numeric:tabular-nums}
.m .d{font-size:11px;font-weight:600;min-height:15px;font-variant-numeric:tabular-nums}
@media(min-width:1072px){.markt{margin:0;padding-left:0;padding-right:0}}
.up{color:var(--up)}.dn{color:var(--dn)}
.brief{margin-top:14px;background:var(--surface);border:1px solid var(--bd);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow)}
.brief h2{margin:0 0 8px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);display:flex;justify-content:space-between}
.brief ul{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.brief li{display:grid;grid-template-columns:10px 1fr;gap:10px;align-items:start;font-size:15px}
.brief li i{width:8px;height:8px;border-radius:50%;margin-top:7px;background:var(--mu)}
.bar{position:sticky;top:0;z-index:10;margin-top:14px;background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);
  padding:calc(env(safe-area-inset-top) + 8px) 0 8px;border-bottom:1px solid transparent}
.bar.stuck{border-bottom-color:var(--bd)}
.search{width:100%;border:1px solid var(--bd);background:var(--surface);color:var(--tx);border-radius:12px;padding:9px 12px;font-size:15px;margin-bottom:8px;outline:none}
.search:focus{border-color:var(--ac)}
nav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;border:1px solid var(--bd);background:var(--surface);color:var(--tx);border-radius:999px;padding:6px 13px;font-size:14px;font-weight:550;cursor:pointer;display:flex;gap:6px;align-items:center}
nav button span{font-size:11px;color:var(--mu);font-weight:600}
nav button.on{background:var(--tx);border-color:var(--tx);color:var(--bg)}
nav button.on span{color:inherit;opacity:.7}
main{padding:12px 0 24px;display:grid;gap:10px}
@media(min-width:860px){main{grid-template-columns:1fr 1fr;gap:12px}}
.card{position:relative;display:block;background:var(--surface);border:1px solid var(--bd);border-radius:16px;padding:13px 15px 12px 18px;color:inherit;text-decoration:none;box-shadow:var(--shadow);overflow:hidden;transition:transform .12s,border-color .12s}
.card:hover{border-color:color-mix(in srgb,var(--ac) 45%,var(--bd))}
.card:active{transform:scale(.995)}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--cc,var(--mu))}
.top{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mu);margin-bottom:5px;flex-wrap:wrap}
.chip{font-weight:700;color:var(--cc);letter-spacing:.03em;text-transform:uppercase;font-size:11px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ac)}
.hot{margin-left:auto;font-size:11px;font-weight:700;color:var(--hot);border:1px solid var(--hot);border-radius:999px;padding:0 8px}
.card h3{margin:0 0 5px;font-size:16.5px;line-height:1.3;letter-spacing:-.005em;font-weight:650}
.card p{margin:0;color:color-mix(in srgb,var(--tx) 82%,var(--bg));font-size:15px}
.card .e{margin-top:8px;padding:7px 10px;border-radius:10px;background:var(--surface2);font-size:13.5px;color:var(--mu)}
.card .e b{color:var(--tx);font-weight:650}
.tag{border:1px solid var(--bd);border-radius:999px;padding:0 8px;font-size:11px}
.leer{grid-column:1/-1;color:var(--mu);text-align:center;padding:48px 0}
.skel{height:92px;border-radius:16px;background:linear-gradient(90deg,var(--surface) 25%,var(--surface2) 50%,var(--surface) 75%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
footer{color:var(--mu);font-size:12px;padding:6px 0 40px;text-align:center}
footer details{margin-top:6px}
footer summary{cursor:pointer}
footer ul{list-style:none;padding:0;margin:8px 0 0;text-align:left;display:inline-block}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div><h1 id="gruss">News</h1><div class="date" id="datum"></div></div>
    <div class="stand" id="stand"></div>
  </div>
  <div class="markt" id="markt"></div>
  <section class="brief" id="brief" hidden></section>
  <div class="bar" id="bar">
    <input class="search" id="q" type="search" placeholder="Suchen …" autocomplete="off">
    <nav id="nav"></nav>
  </div>
  <main id="main"><div class="skel"></div><div class="skel"></div><div class="skel"></div></main>
  <footer id="foot"></footer>
</div>
<script>
const TABS=[["top","Wichtig"],["alle","Alle"],["finanzen","Finanzen"],["deutschland","Deutschland"],["nrw","NRW"],["usa","USA"],["welt","Welt"]];
const NAMES={finanzen:"Finanzen",deutschland:"Deutschland",nrw:"NRW",usa:"USA",welt:"Welt"};
let DATA={items:[],markt:[]},tab="top",query="",lastVisit=0;
try{lastVisit=+localStorage.getItem("lastVisit")||0}catch(e){}

function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function safe(u){return /^https?:\/\//i.test(u)?u:"#"}
function ago(iso){
  const m=Math.round((Date.now()-new Date(iso).getTime())/60000);
  if(m<1)return "gerade eben";
  if(m<60)return "vor "+m+" Min.";
  const h=Math.round(m/60);
  if(h<24)return "vor "+h+" Std.";
  return "vor "+Math.round(h/24)+" Tg.";
}
function colorOf(k){return "var(--c-"+k+")"}

function renderHero(){
  const h=new Date().getHours();
  document.getElementById("gruss").textContent=(h<5?"Gute Nacht":h<11?"Guten Morgen":h<18?"Guten Tag":"Guten Abend")+" Jona";
  document.getElementById("datum").textContent=new Date().toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"});
  const s=document.getElementById("stand");s.textContent="";
  if(DATA.aktualisiert){
    const mins=(Date.now()-new Date(DATA.aktualisiert).getTime())/60000;
    s.className="stand"+(mins>180?" old":"");
    s.appendChild(el("b"));
    s.appendChild(document.createTextNode("Stand "+new Date(DATA.aktualisiert).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})+" Uhr"));
  }
}
function renderMarkt(){
  const box=document.getElementById("markt");box.textContent="";
  (DATA.markt||[]).forEach(m=>{
    const c=el("div","m");
    c.appendChild(el("div","n",m.name));
    c.appendChild(el("div","v",m.wert));
    const d=el("div","d");
    if(typeof m.delta==="number"){
      const up=m.delta>=0;d.className="d "+(up?"up":"dn");
      d.textContent=(up?"▲ ":"▼ ")+Math.abs(m.delta).toFixed(2).replace(".",",")+" %";
    }else if(m.name.startsWith("Basiszins")&&DATA.basiszins_seit){
      d.textContent="seit "+DATA.basiszins_seit;d.style.color="var(--mu)";d.style.fontWeight=500;
    }
    c.appendChild(d);box.appendChild(c);
  });
}
function renderBrief(){
  const b=DATA.briefing,box=document.getElementById("brief");
  if(!b||!b.punkte||!b.punkte.length){box.hidden=true;return}
  box.hidden=false;box.textContent="";
  const h=el("h2");h.appendChild(el("span","","Lage "+b.slot+" Uhr"));
  h.appendChild(el("span","",ago(b.stand)));box.appendChild(h);
  const ul=el("ul");
  b.punkte.forEach(p=>{
    const li=el("li");const i=el("i");i.style.background=colorOf(p.k);
    li.appendChild(i);li.appendChild(el("span","",p.t));ul.appendChild(li);
  });
  box.appendChild(ul);
}
function filtered(){
  let items=(DATA.items||[]).slice();
  const ql=query.trim().toLowerCase();
  if(ql){
    items=items.filter(i=>(i.titel+" "+i.t+" "+(i.e||"")+" "+i.quelle).toLowerCase().includes(ql));
  }else if(tab==="top"){
    items=items.filter(i=>i.s>=7).sort((a,b)=>b.s-a.s||(a.zeit<b.zeit?1:-1)).slice(0,24);
  }else if(tab!=="alle"){
    items=items.filter(i=>i.k===tab);
  }
  return items;
}
function renderNav(){
  const nav=document.getElementById("nav");nav.textContent="";
  const all=DATA.items||[];
  TABS.forEach(([k,l])=>{
    let n=k==="top"?all.filter(i=>i.s>=7).length:k==="alle"?all.length:all.filter(i=>i.k===k).length;
    const b=el("button",k===tab&&!query?"on":"",l);
    b.appendChild(el("span","",String(n)));
    b.onclick=()=>{tab=k;query="";document.getElementById("q").value="";renderNav();renderList();window.scrollTo({top:document.getElementById("bar").offsetTop-4})};
    nav.appendChild(b);
  });
}
function renderList(){
  const main=document.getElementById("main");main.textContent="";
  const items=filtered();
  if(!items.length){main.appendChild(el("div","leer",query?"Nichts gefunden.":"Gerade nichts in dieser Rubrik."));return}
  items.forEach(i=>{
    const a=el("a","card");a.href=safe(i.link);a.target="_blank";a.rel="noopener noreferrer";
    a.style.setProperty("--cc",colorOf(i.k));
    const top=el("div","top");
    if(lastVisit&&new Date(i.zeit).getTime()>lastVisit)top.appendChild(el("span","dot"));
    top.appendChild(el("span","chip",NAMES[i.k]||i.k));
    top.appendChild(el("span","",i.quelle+" · "+ago(i.zeit)));
    if(i.tag)top.appendChild(el("span","tag",i.tag));
    if(i.s>=8)top.appendChild(el("span","hot","wichtig"));
    a.appendChild(top);
    a.appendChild(el("h3","",i.titel));
    a.appendChild(el("p","",i.t));
    if(i.e){const e=el("div","e");e.appendChild(el("b","","Einordnung: "));e.appendChild(document.createTextNode(i.e));a.appendChild(e)}
    main.appendChild(a);
  });
}
function renderFoot(){
  const f=document.getElementById("foot");f.textContent="";
  const fs=(DATA.status&&DATA.status.feeds)||[];
  if(!fs.length)return;
  const ok=fs.filter(x=>x.ok).length;
  const d=el("details");
  d.appendChild(el("summary","",ok+" von "+fs.length+" Quellen aktiv"));
  const ul=el("ul");
  fs.forEach(x=>ul.appendChild(el("li","",(x.ok?"✓ ":"✗ ")+x.name+(x.ok?" ("+x.n+")":""))));
  const ms=(DATA.status&&DATA.status.markt)||[];
  ms.forEach(x=>ul.appendChild(el("li","","✗ Markt "+x)));
  d.appendChild(ul);f.appendChild(d);
}
function renderAll(){renderHero();renderMarkt();renderBrief();renderNav();renderList();renderFoot()}

async function load(){
  try{
    const r=await fetch("data.json?"+Date.now(),{cache:"no-store"});
    DATA=await r.json();
  }catch(e){DATA={items:[],markt:[]}}
  renderAll();
}
document.getElementById("q").addEventListener("input",e=>{query=e.target.value;renderNav();renderList()});
window.addEventListener("scroll",()=>{document.getElementById("bar").classList.toggle("stuck",window.scrollY>document.getElementById("bar").offsetTop)},{passive:true});
function markVisit(){try{localStorage.setItem("lastVisit",String(Date.now()))}catch(e){}}
window.addEventListener("pagehide",markVisit);
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){markVisit()}else{try{lastVisit=+localStorage.getItem("lastVisit")||lastVisit}catch(e){};load()}
});
setInterval(()=>{if(!document.hidden)load()},5*60*1000);
load();
</script>
</body>
</html>
